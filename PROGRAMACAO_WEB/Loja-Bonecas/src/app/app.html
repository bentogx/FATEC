<header class="cabecalho">
  <div class="cabecalho-superior">
    <a routerLink="/" class="marca">
      <img src="logo-barbie2.png" alt="" class="foto-canto" />
      <span>{{ title() }}</span>
    </a>
    <form class="busca-site" role="search" (ngSubmit)="pesquisar()">
      <label class="visualmente-oculto" for="busca-produtos">Pesquisar produtos</label>
      <input id="busca-produtos" name="busca" type="search" placeholder="O que você está procurando?"
        [ngModel]="pesquisa.termo()" (ngModelChange)="pesquisa.atualizar($event)" />
      <button type="submit" aria-label="Pesquisar">🔍</button>
    </form>
  </div>

  <div class="barra-navegacao">
    <nav class="navegacao">
      <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a routerLink="/produtos" routerLinkActive="ativo">Produtos</a>
      <a routerLink="/contato" routerLinkActive="ativo">Contato</a>
      <a routerLink="/login" routerLinkActive="ativo">Login</a>
      <a routerLink="/cadastro" routerLinkActive="ativo">Cadastro</a>
      <a routerLink="/carrinho" routerLinkActive="ativo" class="link-carrinho">
        🛒 Carrinho
        @if (carrinho.quantidadeTotal() > 0) {
          <span class="contador">{{ carrinho.quantidadeTotal() }}</span>
        }
      </a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="rodape">
  <p>&copy; {{ anoAtual }} {{ title() }}. Todos os direitos reservados.</p>
</footer>
