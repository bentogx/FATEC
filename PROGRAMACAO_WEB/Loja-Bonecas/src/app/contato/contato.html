<section class="cabecalho-pagina">
  <h2>Fale Conosco</h2>
  <p>Dúvidas, sugestões ou parcerias — mande sua mensagem.</p>
</section>

<section class="conteudo-contato">
  <form class="formulario-contato" (ngSubmit)="enviar()" #f="ngForm">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" [(ngModel)]="nome" required />

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required />

    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="4" [(ngModel)]="mensagem" required></textarea>

    <button type="submit" class="botao" [disabled]="f.invalid">Enviar mensagem</button>

    @if (enviado()) {
      <p class="confirmacao">Mensagem enviada! Responderemos em breve. 💌</p>
    }
  </form>

  <aside class="info-contato">
    <h3>Outros canais</h3>
    <p>📸 &#64;Matharazzo_Dolls</p>
    <p>📞 (11) 1234-5678</p>
    <p>✉️ contato&#64;matharazzodolls.com.br</p>
    <p>🕑 Seg a Sab, 9h às 20h</p>
  </aside>
</section>
